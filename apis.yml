aid: apurata
name: Apurata
description: >-
  Apurata (legal name Tecno Creditos S.A.C.) is a Peruvian financial-technology
  company, authorized by Peru's banking regulator (SBS), that provides fast fully
  online personal loans and the aCuotaz "buy now, pay later" installment-financing
  product for e-commerce merchants. Consumers borrow from S/100 to S/1,000 with
  funding in as little as 29 minutes, repaid across 1-8 installments. For merchants,
  aCuotaz adds installment checkout with 0% interest options, pays the merchant
  upfront, and integrates via a REST API, webhooks, and prebuilt payment-gateway
  plugins for WooCommerce, Magento 2, Shopify, VTEX, Salesforce, OpenCart, and
  PrestaShop. Apurata also operates aPagos and a Samsung Finance+ financing API.
